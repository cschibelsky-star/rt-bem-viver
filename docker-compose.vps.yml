services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rtbemviver_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:80"
    volumes:
      - rtbemviver_data:/var/www/html/data
      - rtbemviver_uploads:/var/www/html/uploads
    environment:
      APP_ENV: ${APP_ENV:-homologation}
      APP_URL: ${APP_URL:-https://rtbemviver-hml.vitrineiapro.com.br}
    networks:
      - rtbemviver_internal
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: "n8n-traefik_app_network"
      traefik.http.routers.rtbemviver-hml.entrypoints: "websecure"
      traefik.http.routers.rtbemviver-hml.rule: "Host(`rtbemviver-hml.vitrineiapro.com.br`)"
      traefik.http.routers.rtbemviver-hml.tls: "true"
      traefik.http.routers.rtbemviver-hml.tls.certresolver: "le"
      traefik.http.services.rtbemviver-hml.loadbalancer.server.port: "80"
      traefik.http.routers.rtbemviver-prod.entrypoints: "websecure"
      traefik.http.routers.rtbemviver-prod.rule: "Host(`rtbemviver.com.br`) || Host(`www.rtbemviver.com.br`)"
      traefik.http.routers.rtbemviver-prod.tls: "true"
      traefik.http.routers.rtbemviver-prod.tls.certresolver: "le"
      traefik.http.routers.rtbemviver-prod.service: "rtbemviver-hml"
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$c=@file_get_contents(\"http://127.0.0.1/\"); exit($$c===false?1:0);'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  rtbemviver_data:
    name: rtbemviver_data
  rtbemviver_uploads:
    name: rtbemviver_uploads

networks:
  rtbemviver_internal:
    name: rtbemviver_internal
    internal: true
  traefik:
    external: true
    name: n8n-traefik_app_network
