services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rtbemviver_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:80"
    volumes:
      - rtbemviver_data:/var/www/html/data
      - rtbemviver_uploads:/var/www/html/uploads
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL:-https://rtbemviver.com.br}
      ADMIN_RECOVERY_CODE: ${ADMIN_RECOVERY_CODE}
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$c=@file_get_contents(\"http://127.0.0.1/\"); exit($$c===false?1:0);'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  rtbemviver_data:
    name: rtbemviver_data
  rtbemviver_uploads:
    name: rtbemviver_uploads
